    <text x="25" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Across 4 Benchmark Ingestion Regimes</text>

    <!-- Bar 1 -->
    <text x="25" y="85" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">1. Born-Digital PDF Stream (100%)</text>
    <rect x="25" y="94" width="295" height="12" rx="3" fill="#1e293b" />
    <rect x="25" y="94" width="295" height="12" rx="3" fill="#38bdf8" />

    <!-- Bar 2 -->
    <text x="25" y="135" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">2. Clean 2D-Tiled OCR (100%)</text>
    <rect x="25" y="144" width="295" height="12" rx="3" fill="#1e293b" />
    <rect x="25" y="144" width="295" height="12" rx="3" fill="#10b981" />

    <!-- Bar 3 -->
