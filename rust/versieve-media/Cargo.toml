[package]
name = "versieve-media"
version = "0.1.0"
edition = "2021"
description = "Compact, zero-import, zero-dependency Rust/WebAssembly multimodal core for Versieve: bomb-guarded DEFLATE/GZIP/ZIP/TAR/CFBF(.msg), Unicode anti-evasion + international checksum PII & 30+ secret scanner, Spoken ITN, RIFF WAV DSP + metadata scrubber, JPEG/PNG/MP4 metadata scrubber, RGB/RGBA pixel redaction, and video scene-change/temporal box tracking."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
