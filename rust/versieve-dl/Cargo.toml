[package]
name = "mle_dl"
version = "0.1.0"
edition = "2021"
description = "Multiplatform compiled deep learning, BitNet embedding, and VeRA core for MLE"

[lib]
name = "mle_dl"
crate-type = ["cdylib", "staticlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
