    <rect x="25" y="244" width="295" height="12" rx="3" fill="#1e293b" />
    <rect x="25" y="244" width="156" height="12" rx="3" fill="#f43f5e" />

    <text x="25" y="278" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Measured CER on Bad Fax Scan: 47%</text>
  </g>

