name: CI

on:
  push:
    branches: [ main, fix/spec-15-remediation ]
  pull_request:
    branches: [ main, fix/spec-15-remediation ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run CLI Selftest
      run: node bin/versieve.mjs selftest

    - name: Verify Zero-Egress WASM Audit
      run: node bin/versieve.mjs audit-wasm

    - name: Run Portable Test Suite
      run: npm run test:ci
